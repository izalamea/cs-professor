/* ------------------------------------------------------------------ links in answers */

const REF_RE = /(^|[\s(\[`'">])((?:\/|\.\/)?(?:[\w.@!+-]+\/)*[\w.@!+-]+\.(?:go|mod|sum|md|js|mjs|ts|tsx|jsx|py|json|ya?ml|toml|sh|html|css|txt|proto|sql|c|h|cc|cpp|rs|java|kt))(?::(\d+)(?:[-–](\d+))?)?(?![\w/])/g;

function resolveRef(p) {
  if (p.startsWith("./")) p = p.slice(2);
  if (p.startsWith("/")) {
    if (S.root && p.startsWith(S.root + "/")) p = p.slice(S.root.length + 1);
    else return p.startsWith(B.goroot + "/") || (B.modcache && p.startsWith(B.modcache + "/")) ? p : null;
  }
  if (S.fileSet.has(p)) return p;
  const m = S.files.filter(f => f.endsWith("/" + p));
  return m.length ? m.sort((a, b) => a.length - b.length)[0] : null;
}

function linkify(html) {
  return html.replace(REF_RE, (m, pre, p, l1, l2) => {
    const rp = resolveRef(p.replace(/&amp;/g, "&"));
    if (!rp) return m;
    return `${pre}<a class="ref" data-p="${esc(rp)}" data-l="${l1 || ""}" data-e="${l2 || ""}">${p}${l1 ? ":" + l1 : ""}${l2 ? "-" + l2 : ""}</a>`;
  });
}

function openRef(a) {
  const l = +a.dataset.l || 0, e = +a.dataset.e || l;
  openFile(a.dataset.p, l, { end: e });
}

/* ------------------------------------------------------------------ markdown */

function mdInline(s) {
  const codes = [];
  const stash = [];
  const keep = html => { stash.push(html); return `\u0001${stash.length - 1}\u0001`; };
  const raw = u => u.replace(/&amp;/g, "&");
  let h = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  h = h.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\s*\)/g, (_, alt, u) => keep(`<img alt="${alt}" src="${esc(imgURL(raw(u)))}">`))
       .replace(/\[([^\]]+)\]\(\s*([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\s*\)/g, (_, t, u) => keep(linkTo(t, raw(u))))
       .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, (_, u) => keep(`<a href="${u}" target="_blank" rel="noopener">${u}</a>`))
       .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
       .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>")
       .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  h = linkify(h).replace(/~~([^~]+)~~/g, "<s>$1</s>");
  while (h.includes("\u0001")) h = h.replace(/\u0001(\d+)\u0001/g, (_, i) => stash[+i]); // links can wrap images
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => {
    const c = codes[+i];
    const linked = linkify(" " + c).slice(1);
    return linked !== c && /^<a [^>]+>[^<]+<\/a>$/.test(linked) ? linked.replace(/^(<a [^>]+>)(.*)(<\/a>)$/, "$1<code>$2</code>$3") : `<code>${c}</code>`;
  });
}

// MD_BASE is the folder of the markdown file being rendered as a document
// (null while rendering chat answers). Relative links resolve against it.
let MD_BASE = null;

function normPath(p) {
  const abs = p.startsWith("/"), out = [];
  for (const seg of p.split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") out.pop(); else out.push(seg);
  }
  return (abs ? "/" : "") + out.join("/");
}
function relPath(u) {
  u = decodeURIComponent(u.split("#")[0].split("?")[0]);
  if (u.startsWith("/")) return normPath(u.slice(1)); // GitHub style: repo-root relative
  return normPath((MD_BASE ? MD_BASE + "/" : "") + u);
}
function slug(t) {
  return t.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z]+;|&#\d+;/g, "").trim().replace(/[^\w\s-]/g, "").replace(/\s/g, "-");
}
function imgURL(u) {
  if (/^(https?:|data:)/i.test(u) || MD_BASE == null) return u;
  return `/api/raw?root=${encodeURIComponent(S.root)}&path=${encodeURIComponent(relPath(u))}&t=${B.token}`;
}
function linkTo(text, u) {
  if (/^(https?:|mailto:)/i.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener">${text}</a>`;
  if (u.startsWith("#")) return `<a class="anchor" data-anchor="${esc(slug(decodeURIComponent(u.slice(1))))}">${text}</a>`;
  if (MD_BASE == null) return text;
  let p = relPath(u);
  const anchor = u.includes("#") ? u.split("#")[1] : "";
  if (!S.fileSet.has(p)) {
    const readme = S.files.find(f => f.toLowerCase() === (p ? p + "/" : "") + "readme.md");
    if (readme) p = readme;
  }
  if (!S.fileSet.has(p) && !(p.startsWith("/") && resolveRef(p))) return `<span title="${esc(u)}">${text}</span>`;
  const m = /^L(\d+)/.exec(anchor);
  return `<a class="ref" data-p="${esc(p)}" data-l="${m ? m[1] : ""}" data-e="">${text}</a>`;
}

// Docs often embed bits of HTML; keep images and line breaks, drop other tags.
function htmlToMd(src) {
  return src.replace(/<!--[\s\S]*?-->/g, "")
    .replace(/<img\b[^>]*?\bsrc=["']([^"']+)["'][^>]*>/gi, (m, u) => { const a = /\balt=["']([^"']*)["']/i.exec(m); return `![${a ? a[1] : ""}](${u})`; })
    .replace(/<a\b[^>]*?\bhref=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, (_, u, t) => `[${t.trim() || u}](${u})`)
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/?(p|div|span|picture|source|center|details|summary|sup|sub|kbd|b|strong|i|em|h[1-6]|table|thead|tbody|tr|td|th|ul|ol|li)\b[^>]*>/gi, "");
}

function md(src) {
  const lines = src.split("\n");
  let out = "", i = 0;
  const isBlockStart = l => /^\s*```/.test(l) || /^#{1,6}\s/.test(l) || /^\s*([-*+]|\d+[.)])\s+/.test(l) || /^\s*>/.test(l) || /^\s*\|.*\|\s*$/.test(l) || /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = /^\s*```\s*([\w+-]*)/.exec(l))) {
      const lang = (m[1] || (MD_BASE != null || !S.cur ? "" : S.cur.lang)).toLowerCase(), buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const lg = { golang: "go", javascript: "js", typescript: "ts", typescriptreact: "ts", javascriptreact: "js", tsx: "ts", jsx: "js", python: "py", python3: "py", bash: "sh", shell: "sh", zsh: "sh", console: "sh", cpp: "c", "c++": "c", objc: "c", "objective-c": "c", h: "c", swift: "swift" }[lang] || lang;
      if (lg === "request" && MD_BASE == null) {
        out += `<div class="req"><div class="req-h">✎ Change request for a coding agent<button data-a="copyreq">Copy</button></div><pre>${esc(buf.join("\n"))}</pre></div>`;
        continue;
      }
      out += `<pre><code>${KW[lg] || lg === "go" ? highlight(buf.join("\n"), lg) : esc(buf.join("\n"))}</code></pre>`;
      continue;
    }
    if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l))) {
      const n = MD_BASE != null ? m[1].length : Math.min(4, m[1].length + 1), inner = mdInline(m[2]);
      out += `<h${n}${MD_BASE != null ? ` id="${esc(slug(m[2]))}"` : ""}>${inner}</h${n}>`; i++; continue;
    }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l);
      out += ordered ? "<ol>" : "<ul>";
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && !/^\s*```/.test(lines[i])))) {
        const im = /^(\s*)([-*+]|\d+[.)])\s+(.*)/.exec(lines[i]);
        if (im) {
          const depth = Math.floor(im[1].length / 2);
          const task = /^\[( |x|X)\]\s+(.*)/.exec(im[3]);
          out += `<li${depth ? ` style="margin-left:${depth * 16}px"` : ""}${task ? ` class="task"` : ""}>` +
            (task ? `<input type="checkbox" disabled${task[1] !== " " ? " checked" : ""}> ${mdInline(task[2])}` : mdInline(im[3]));
        } else out += " " + mdInline(lines[i].trim());
        i++;
      }
      out += ordered ? "</ol>" : "</ul>";
      continue;
    }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out += `<blockquote>${md(buf.join("\n"))}</blockquote>`;
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += "<table><tr>" + cells(l).map(c => `<th>${mdInline(c)}</th>`).join("") + "</tr>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) out += "<tr>" + cells(lines[i++]).map(c => `<td>${mdInline(c)}</td>`).join("") + "</tr>";
      out += "</table>";
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [l];
    i++;
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    out += `<p>${mdInline(buf.join("\n")).replace(/\n/g, "<br>")}</p>`;
  }
  return out;
}

/* ------------------------------------------------------------------ chat */

function chatKey() { return "chat:" + S.root; }
function loadChat() {
  S.chat = store.get(chatKey(), null) || { session: "", msgs: [] };
  S.chat.msgs.forEach(m => { if (m.pending) { m.pending = false; m.stopped = true; } });
  renderChat();
}
function saveChat() { store.set(chatKey(), { session: S.chat.session, msgs: S.chat.msgs.slice(-80) }); }

// Starter questions: generic ones for the repo's main language right away,
// replaced by questions Claude writes for this specific repo (cached).
function suggestions() {
  const cached = S.root && store.get("sugg:" + S.root, null);
  if (cached && cached.length) return cached;
  if (S.root && B.claude && !S.suggesting && !S.suggestFailed) fetchSuggestions();
  const counts = {};
  for (const f of S.files) { const l = langOfPath(f); if (l) counts[l] = (counts[l] || 0) + 1; }
  const main = LANG_NAME[Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0]] || "";
  return [
    { label: "Give me a tour of this repo", question: "Give me a tour of this repository: what it does, its main parts, and where execution starts." },
    { label: "Trace the main flow end to end", question: "Pick the most important user-facing action in this repository and trace it end to end: every function it passes through (with file:line), the data it carries, and where state changes." },
    { label: "Where are the hot spots and fragile parts?", question: "Where are the performance hot spots, the fragile or tangled parts, and the obvious extension points in this repository? For each, say what a good change would be." },
    { label: "Suggest a reading order", question: "Suggest a reading order for this codebase, with what to look for in each file." },
  ];
}

async function fetchSuggestions() {
  const root = S.root;
  S.suggesting = true;
  try {
    const r = await api("/api/suggest", { root });
    store.set("sugg:" + root, r.suggestions);
  } catch { if (S.root === root) S.suggestFailed = true; }
  if (S.root === root) S.suggesting = false;
  if (S.root === root && !S.chat.msgs.length) renderChat();
}

// Scrolling: the chat never follows a streaming answer. Sending a question
// brings that question to the top of the panel; the answer grows below it and
// the user scrolls at their own pace. "how": "bottom" (opening a saved chat),
// "question" (just asked), "keep" (re-render in place).
function renderChat(how = "bottom") {
  const box = $("#msgs");
  if (!S.chat.msgs.length) {
    box.innerHTML = `<div class="empty-chat">
      ${B.claude ? "" : `<p class="err">The <code>claude</code> CLI wasn't found when coderead started, so the tutor can't answer. Install Claude Code and restart coderead.</p>`}
      <p>Ask anything about <b>${esc(S.name || "this repo")}</b>. For example:</p>
      <ul>${suggestions().map(q => `<li><a href="#" data-ask="${esc(q.question)}">${esc(q.label)}</a></li>`).join("")}</ul>
      ${S.suggesting ? `<p class="help dots">Tailoring suggestions to this repo</p>` : S.root && B.claude ? `<p class="help"><a href="#" data-a="resuggest">↻ Suggest other questions</a></p>` : ""}
      <p class="help">Answers come from <code>claude</code> running in the repo folder with read-only tools, using your Claude account.</p></div>`;
    return;
  }
  box.innerHTML = S.chat.msgs.map((m, i) => `<div class="msg ${m.role}" data-i="${i}">${msgHTML(m)}</div>`).join("");
  if (how === "bottom") box.scrollTop = box.scrollHeight;
  else if (how === "question") {
    const q = [...box.querySelectorAll(".msg.user")].pop(), a = box.lastElementChild;
    if (q) {
      // Room below the question so it can sit at the top before the answer exists.
      if (a && a !== q) a.style.minHeight = Math.max(0, box.clientHeight - q.offsetHeight - 40) + "px";
      box.scrollTop = q.offsetTop - box.offsetTop - 8;
    }
  }
  updateJump();
}

// A small "↓" button appears when there's unread text below the visible part.
function updateJump() {
  const box = $("#msgs"), b = $("#jump");
  if (!box || !b) return;
  const below = box.scrollHeight - box.scrollTop - box.clientHeight > 40;
  b.classList.toggle("on", below);
  b.textContent = below && S.busy ? "↓ Writing below" : "↓";
}

function msgHTML(m) {
  if (m.role === "user") return (m.imgs && m.imgs.length ? `<div class="msg-imgs">${m.imgs.map(p => `<a href="${esc(pasteURL(p))}" target="_blank" rel="noopener"><img src="${esc(pasteURL(p))}" alt="pasted image"></a>`).join("")}</div>` : "") +
    (m.ctx ? `<span class="ctx">${linkify(" " + esc(m.ctx)).slice(1)}</span>` : "") + esc(m.text);
  let h = "";
  if (m.tools && m.tools.length) h += `<div class="tools">${m.tools.map(t => `<div>${esc(t)}</div>`).join("")}</div>`;
  if (m.text) h += md(m.text);
  if (m.pending && !m.text) h += `<div class="help dots">${m.tools && m.tools.length ? "Reading the code" : "Thinking"}</div>`;
  if (m.error) h += `<div class="err">${esc(m.error)}</div>`;
  if (m.stopped && !m.error) h += `<div class="help">(stopped)</div>`;
  if (!m.pending && !m.error && m.text && !/```request/.test(m.text))
    h += `<div class="msg-acts"><button class="ghost" data-a="toreq" title="Write what we just discussed as a precise request for a coding agent">✎ Draft a change request from this</button></div>`;
  return h;
}

let renderQueued = false;
function updateMsg(m) {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const i = S.chat.msgs.indexOf(m);
    const el = $(`#msgs .msg[data-i="${i}"]`);
    if (!el) { renderChat("keep"); return; }
    const box = $("#msgs"), top = box.scrollTop;
    el.innerHTML = msgHTML(m);
    box.scrollTop = top; // stay put while text arrives
    updateJump();
  });
}

function snippet(from, to, mark) {
  const L = S.cur.lines;
  const w = String(to).length;
  const out = [];
  for (let i = Math.max(1, from); i <= Math.min(L.length, to); i++)
    out.push(`${i === mark ? "→" : " "}${String(i).padStart(w)} | ${L[i - 1]}`);
  return out.join("\n");
}

function ctxLabel(ctx) {
  if (!ctx) return "";
  if (ctx.kind === "symbol") return `${ctx.file}:${ctx.line} · ${ctx.name}`;
  if (ctx.kind === "lines") return ctx.from === ctx.to ? `${ctx.file}:${ctx.from}` : `${ctx.file}:${ctx.from}-${ctx.to}`;
  return "";
}

function buildPrompt(q, ctx) {
  let p = "";
  const fence = S.cur ? S.cur.lang === "go" ? "go" : S.cur.lang : "";
  if (ctx && ctx.kind === "symbol" && S.cur && S.cur.path === ctx.file) {
    p += `[Browser context] I clicked on \`${ctx.name}\` at ${ctx.file}:${ctx.line}:${ctx.col}.\n`;
    if (ctx.facts) p += `The browser's language tools say: ${ctx.facts}\n`;
    p += `Code around it (→ marks the line):\n\`\`\`${fence}\n${snippet(ctx.line - 10, ctx.line + 10, ctx.line)}\n\`\`\`\n\n`;
  } else if (ctx && ctx.kind === "lines" && S.cur && S.cur.path === ctx.file) {
    const to = Math.min(ctx.to, ctx.from + 250);
    p += `[Browser context] I selected ${ctx.file}:${ctx.from}-${ctx.to}:\n\`\`\`${fence}\n${snippet(ctx.from, to, 0)}\n\`\`\`\n\n`;
  } else if (S.cur) {
    p += S.cur.view === "preview" ? `[Browser context] I'm reading the rendered markdown of ${S.cur.path}.\n\n`
      : `[Browser context] I'm looking at ${S.cur.path} around line ${visibleLine()}.\n\n`;
  }
  return p + q;
}

async function ask(question, ctx, shown) {
  if (S.busy) return;
  if (!S.root) { openModal(); return; }
  ctx = ctx || S.chip;
  S.chip = null; renderChip();
  const imgs = S.atts.filter(a => a.path).map(a => a.path);
  S.atts = []; renderAtts();
  const um = { role: "user", text: shown ? "✎ Change: " + shown : question, ctx: ctxLabel(ctx), imgs };
  const am = { role: "assistant", text: "", tools: [], pending: true };
  S.chat.msgs.push(um, am);
  renderChat("question");
  const pics = imgs.length ? `[Attached images] I pasted ${imgs.length === 1 ? "a screenshot" : imgs.length + " screenshots"}. Open ${imgs.length === 1 ? "it" : "each"} with the Read tool before answering, and connect what it shows to the code:\n${imgs.map(p => "- " + p).join("\n")}\n\n` : "";
  await stream(am, pics + buildPrompt(question, ctx), true);
}

async function stream(am, prompt, mayRetry) {
  S.busy = true; setBusy();
  const ctrl = new AbortController();
  S.abort = ctrl;
  try {
    const r = await fetch("/api/ask", {
      method: "POST", signal: ctrl.signal,
      headers: { "X-Token": B.token, "Content-Type": "application/json" },
      body: JSON.stringify({ root: S.root, prompt, session: S.chat.session, model: $("#model").value, effort: $("#effort").value }),
    });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.statusText); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.t === "session") S.chat.session = ev.id;
        else if (ev.t === "block") { if (am.text && !am.text.endsWith("\n\n")) am.text += "\n\n"; }
        else if (ev.t === "text") am.text += ev.d;
        else if (ev.t === "tool") am.tools.push(`${ev.name === "Read" ? "📄" : ev.name === "Grep" ? "🔎" : "📁"} ${ev.name} ${toolDetail(ev.detail)}`);
        else if (ev.t === "done") {
          if (ev.session) S.chat.session = ev.session;
          if (ev.error) am.error = ev.result || ev.subtype || "The tutor stopped with an error.";
          else if (!am.text && ev.result) am.text = ev.result;
        } else if (ev.t === "error") am.error = ev.d || "claude exited unexpectedly";
        updateMsg(am);
      }
    }
  } catch (e) {
    if (e.name === "AbortError") am.stopped = true;
    else am.error = e.message;
  }
  S.busy = false; S.abort = null; setBusy();
  if (am.error && mayRetry && S.chat.session && !am.text && /no conversation|not found|session/i.test(am.error)) {
    // The saved session is gone (e.g. cleaned up): start a fresh one.
    S.chat.session = ""; am.error = ""; am.tools = [];
    return stream(am, prompt, false);
  }
  am.pending = false;
  updateMsg(am);
  saveChat();
}

function toolDetail(d) {
  if (!d) return "";
  if (S.root) d = d.split(S.root + "/").join("");
  if (B.goroot) d = d.split(B.goroot + "/").join("$GOROOT/");
  return d;
}

function setBusy() {
  const b = $("#sendBtn");
  b.textContent = S.busy ? "Stop" : S.mode === "change" ? "Draft" : "Ask";
  b.classList.toggle("primary", !S.busy);
  updateJump();
}

function renderChip() {
  const box = $("#chipBox");
  if (!S.chip) { box.innerHTML = ""; return; }
  box.innerHTML = `<span class="chip"><span>📎 ${esc(ctxLabel(S.chip))}</span><button title="Remove">✕</button></span>`;
}
$("#chipBox").addEventListener("click", e => { if (e.target.closest("button")) { S.chip = null; renderChip(); } });

const CHANGE_PROMPT = `[Draft a change request] Here is a change I want, in my own words:

«QUESTION»

Read the relevant code first. Then answer in three parts:
1. **How it works today**: the files, functions (with \`path:line\`) and data flow behind what I described, and what causes the behavior I want to change. Only what you verified in the code; say what you didn't check.
2. **Options**: one to three concrete ways to make the change, each with its trade-offs (complexity, performance, risk, what else it touches). Recommend one.
3. **The request**: for the recommended option, a self-contained instruction for a coding agent that hasn't seen this conversation, in a fenced block that starts with \`\`\`request. Write it in the imperative. Include: the goal in one sentence; which files and functions to change and how; the invariants and existing behavior to preserve; edge cases; and how to verify it (tests to add or run, what to check by hand). Add code only where a short snippet removes ambiguity.

If my description is ambiguous, state the assumption you made, and end with one question that would sharpen the request.`;

S.mode = store.get("mode", "ask") === "change" ? "change" : "ask";
function setMode(m) {
  S.mode = m; store.set("mode", m);
  $$(".modes [data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("#q").placeholder = m === "change"
    ? "Describe the change in your own words, e.g. “search feels slow”…  (Enter to send)"
    : "Ask about this code…  (Enter to send, paste screenshots)";
  $("#modeHelp").textContent = m === "change" ? "You get: how it works now, options, and a request to copy into a coding agent" : "";
  setBusy();
}
$(".modes").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) { setMode(b.dataset.mode); $("#q").focus(); } });
function startChange(ctx) { S.chip = ctx; renderChip(); setMode("change"); $("#q").focus(); }

// Pasted or dropped images: saved by the server, sent to the assistant as file
// paths it opens with its Read tool, and shown as thumbnails in the chat.
S.atts = [];
const pasteURL = p => `/api/raw?root=${encodeURIComponent(S.root || "/")}&path=${encodeURIComponent(p)}&t=${B.token}`;
function renderAtts() {
  $("#atts").innerHTML = S.atts.map((a, i) => a.path
    ? `<div class="att"><img src="${esc(pasteURL(a.path))}" alt=""><button class="ghost" data-i="${i}" title="Remove">✕</button></div>`
    : `<div class="att loading">${a.error ? "failed" : "…"}</div>`).join("");
}
async function addImages(files) {
  for (const f of files) {
    if (!/^image\//.test(f.type)) continue;
    const a = {}; S.atts.push(a); renderAtts();
    try {
      const r = await fetch("/api/paste", { method: "POST", headers: { "X-Token": B.token, "Content-Type": "application/octet-stream" }, body: f });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
      a.path = j.path;
    } catch (err) { a.error = err.message; setTimeout(() => { S.atts = S.atts.filter(x => x !== a); renderAtts(); }, 2500); }
    renderAtts();
  }
}
$("#atts").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { S.atts.splice(+b.dataset.i, 1); renderAtts(); } });
$("#q").addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addImages(files); }
});
const composer = $(".composer");
composer.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); composer.classList.add("drop"); } });
composer.addEventListener("dragleave", () => composer.classList.remove("drop"));
composer.addEventListener("drop", e => { composer.classList.remove("drop"); if (e.dataTransfer.files.length) { e.preventDefault(); addImages([...e.dataTransfer.files]); } });

function send() {
  if (S.busy) { if (S.abort) S.abort.abort(); return; }
  const q = $("#q");
  let v = q.value.trim();
  if (S.atts.some(a => !a.path && !a.error)) return; // still uploading
  if (!v && !S.atts.some(a => a.path)) return;
  if (!v) v = "What am I looking at in this screenshot, and which code is behind it?";
  q.value = ""; autosize();
  ask(S.mode === "change" ? CHANGE_PROMPT.replace("QUESTION", v) : v, null, S.mode === "change" ? v : null);
}
$("#sendBtn").onclick = send;
$("#msgs").addEventListener("scroll", updateJump, { passive: true });
$("#jump").onclick = () => { const b = $("#msgs"); b.scrollTo({ top: b.scrollHeight, behavior: "smooth" }); };
const autosize = () => { const q = $("#q"); q.style.height = "auto"; q.style.height = Math.min(200, q.scrollHeight) + "px"; };
$("#q").addEventListener("input", autosize);
// Ctrl+A: start of line. Ctrl+E or Ctrl+B: end of line. Shift extends the selection.
function lineJump(ta, toEnd, extend) {
  const v = ta.value, pos = ta.selectionDirection === "backward" ? ta.selectionStart : ta.selectionEnd;
  let to;
  if (toEnd) { to = v.indexOf("\n", pos); if (to < 0) to = v.length; }
  else to = v.lastIndexOf("\n", pos - 1) + 1;
  if (!extend) { ta.setSelectionRange(to, to); return; }
  const anchor = ta.selectionDirection === "backward" ? ta.selectionEnd : ta.selectionStart;
  ta.setSelectionRange(Math.min(anchor, to), Math.max(anchor, to), to < anchor ? "backward" : "forward");
}
$("#q").addEventListener("keydown", e => {
  if (e.ctrlKey && !e.metaKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "a" || k === "e" || k === "b") { e.preventDefault(); lineJump(e.target, k !== "a", e.shiftKey); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("#msgs").addEventListener("click", e => {
  const a = e.target.closest("a.ref");
  if (a) { e.preventDefault(); openRef(a); return; }
  const q = e.target.closest("[data-ask]");
  if (q) { e.preventDefault(); ask(q.dataset.ask, null); return; }
  const cp = e.target.closest("[data-a=copyreq]");
  if (cp) {
    const text = cp.closest(".req").querySelector("pre").textContent;
    navigator.clipboard.writeText(text).then(() => { cp.textContent = "Copied ✓"; setTimeout(() => cp.textContent = "Copy", 1500); },
      () => { cp.textContent = "Select and copy"; });
    return;
  }
  if (e.target.closest("[data-a=toreq]")) {
    ask(CHANGE_PROMPT.replace("«QUESTION»", "«Based on what we just discussed: the change or improvement your last answer points to. If there are several, pick the most valuable one.»"), null, "a request from the last answer");
    return;
  }
  if (e.target.closest("[data-a=resuggest]")) {
    e.preventDefault(); store.set("sugg:" + S.root, null); S.suggestFailed = false; fetchSuggestions(); renderChat();
  }
});
$("#newChat").onclick = () => {
  if (S.busy && S.abort) S.abort.abort();
  S.chat = { session: "", msgs: [] }; saveChat(); renderChat();
};
for (const id of ["model", "effort"]) {
  const el = $("#" + id);
  el.value = store.get(id, id === "model" ? "sonnet" : "medium");
  el.addEventListener("change", () => store.set(id, el.value));
}

/* ------------------------------------------------------------------ folder dialog */

let dirCur = "";
async function browse(dir) {
  try {
    const r = await api("/api/browse", dir ? { dir } : {});
    dirCur = r.dir;
    $("#dirInput").value = r.dir;
    $("#dirList").innerHTML = r.entries.map(e => `<div class="de" data-n="${esc(e.name)}">
        <span>📁</span><span class="nm">${esc(e.name)}</span>
        ${e.gomod ? `<span class="tag go">GO</span>` : ""}${e.git ? `<span class="tag">GIT</span>` : ""}
        ${e.gomod || e.git ? `<button data-open="${esc(e.name)}">Open</button>` : ""}</div>`).join("")
      || `<div class="muted">No subfolders.</div>`;
    $("#dirOpen").textContent = r.gomod || r.git ? `Open ${r.dir.split("/").pop()}` : "Open this folder";
  } catch (e) { $("#dirList").innerHTML = `<div class="muted err">${esc(e.message)}</div>`; }
}
function openModal() {
  $("#modal").classList.add("on");
  const recent = store.get("recent", []);
  $("#recent").innerHTML = recent.length ? "Recent: " + recent.map(r => `<button data-r="${esc(r)}" title="${esc(r)}">${esc(r.split("/").pop())}</button>`).join("") : "";
  browse(S.root ? S.root.split("/").slice(0, -1).join("/") || "/" : B.home);
}
function closeModal() { $("#modal").classList.remove("on"); }
const join = (a, b) => (a === "/" ? "" : a) + "/" + b;
$("#dirList").addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) { closeModal(); setRoot(join(dirCur, o.dataset.open)); return; }
  const d = e.target.closest("[data-n]");
  if (d) browse(join(dirCur, d.dataset.n));
});
$("#recent").addEventListener("click", e => { const r = e.target.closest("[data-r]"); if (r) { closeModal(); setRoot(r.dataset.r); } });
$("#dirUp").onclick = () => browse(dirCur.split("/").slice(0, -1).join("/") || "/");
$("#dirGo").onclick = () => browse($("#dirInput").value.trim());
$("#dirInput").addEventListener("keydown", e => { if (e.key === "Enter") browse(e.target.value.trim()); });
$("#dirOpen").onclick = () => { closeModal(); setRoot(dirCur); };
$("#dirCancel").onclick = closeModal;
$("#repoBtn").onclick = openModal;
$("#modal").addEventListener("mousedown", e => { if (e.target.id === "modal" && S.root) closeModal(); });

/* ------------------------------------------------------------------ layout + keys */

$$(".resizer").forEach(r => {
  r.addEventListener("mousedown", e => {
    e.preventDefault();
    r.classList.add("drag");
    const which = r.dataset.r;
    const move = ev => {
      const v = which === "side" ? ev.clientX : window.innerWidth - ev.clientX;
      const px = Math.max(160, Math.min(window.innerWidth * 0.6, v));
      document.documentElement.style.setProperty("--" + which, px + "px");
    };
    const up = () => {
      r.classList.remove("drag");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      store.set("w-" + which, getComputedStyle(document.documentElement).getPropertyValue("--" + which).trim());
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
});
for (const w of ["side", "chat"]) { const v = store.get("w-" + w, null); if (v) document.documentElement.style.setProperty("--" + w, v); }

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape") { closePop(); if (S.root) closeModal(); }
  const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
  if (e.altKey && e.key === "ArrowLeft" && !typing) { e.preventDefault(); goBack(); }
  if (e.altKey && e.key === "ArrowRight" && !typing) { e.preventDefault(); goFwd(); }
  if (mod && !e.shiftKey && e.key.toLowerCase() === "p") { e.preventDefault(); setTab("files"); $("#filter").focus(); $("#filter").select(); }
  if (mod && e.shiftKey && e.key.toLowerCase() === "f") { e.preventDefault(); setTab("search"); $("#searchQ").focus(); $("#searchQ").select(); }
});
window.addEventListener("resize", closePop);
$("#code").addEventListener("scroll", () => { if ($("#pop").classList.contains("on")) { const el = $(".x.active"); if (el) placePop(el); } });
window.addEventListener("hashchange", () => {
  const h = parseHash();
  if (h && S.cur && (h.path !== S.cur.path)) openFile(h.path, h.line);
});

/* ------------------------------------------------------------------ start */

setMode(S.mode);
renderChat();
const startRoot = B.root || store.get("root", "");
if (startRoot) setRoot(startRoot); else { showEmpty(); openModal(); }
function showEmpty() { $("#code").innerHTML = `<div class="welcome"><h1>coderead</h1><p>Pick a repository to start exploring.</p></div>`; }
</script>
</body>
</html>
